# Node-specific parameters, keyed by node name. Machine values are not repeated here: they live in
# config/robot/*.yaml and reach every node through the /** wildcard (design section 7).
#
# Every key below already has the same default inside its node, so this file exists to make the
# configuration visible and editable, not to make the stack start (F-14).
global_costmap:
  ros__parameters:
    # A cell /map never saw stays unknown; inflating it would invent obstacles.
    inflate_unknown: false
    occupied_threshold: 65
    free_threshold: 25
    # /global_costmap/global_costmap_visual for RViz, which cannot draw eltanin_msgs/Costmap.
    publish_visualization: true

global_path_planner:
  ros__parameters:
    # astar or hybrid_astar. hybrid_astar plans in (x, y, yaw) and respects a turning radius; its
    # result is published unsmoothed, because the smoother would pull it off that curvature.
    planner_type: hybrid_astar
    # Chebyshev radius used to nudge a blocked start onto a free cell; 0 disables the rescue.
    # Both searches take it, so it is written once.
    start_search_radius_cells: 8
    # weight_data + 4 * weight_smooth must stay below 2 or the smoother diverges; the node
    # refuses to start otherwise. Keeping weight_data + 2 * weight_smooth <= 1 additionally makes
    # every update a convex combination, which is what stops an A* staircase from surviving
    # smoothing (eltanin docs/planner-design.md 8.3 / 13.14).
    weight_data: 0.1
    weight_smooth: 0.4
    smoother_tolerance: 0.0001
    smoother_max_iterations: 100
    # Publishes /global_path_planner/global_path_raw, the path before smoothing.
    publish_raw_path: false
    # On because rviz/eltanin.rviz displays it; test_rviz_config.py fails when the two disagree.
    publish_footprint_path: true
    # An unknown cell is not traversable; set true only where driving into the unknown is wanted.
    unknown_is_free: false
    # A deliberate departure from the design's timeout of 0, which is for periodic work (D-T7-7).
    tf_lookup_timeout: 0.1
    # One outline every N poses. 2 spaces them 0.10-0.14 m against a 0.387 m footprint; 10 left gaps.
    footprint_marker_stride: 2

    # Only read when planner_type is hybrid_astar, but validated at startup either way.
    hybrid:
      heading_bins: 72
      minimum_turning_radius: 0.4
      # 0 selects sqrt(2) * resolution. The left-right reversal count in the output is dominated
      # by this value, not by steering_change_penalty (eltanin docs/planner-design.md 13.9).
      motion_step: 0.0
      # 0 selects half a map cell.
      collision_check_step: 0.0
      # Dubins connection is tried at every node inside this distance from the goal.
      dubins_expansion_distance: 1.0
      # Beyond that, it is tried every (cells to goal / this) nodes. Raising it above 1.0 tries
      # more often and measurably worsens detours (eltanin docs/planner-design.md 13.12).
      analytic_expansion_ratio: 1.0
      # dubins is forward arcs only, for a car. differential adds turning on the spot, which is
      # what this robot does; the returned path then contains poses that share a position.
      # On the reference map a requested goal heading is reachable in 3 of 8 directions under
      # dubins and in 8 of 8 under differential (eltanin docs/planner-design.md 13.15).
      motion_model: differential
      # Weight on the distance-over-cells heuristic. Above about 0.9 the search goes greedy and
      # the path weaves; 1.0 is roughly 25x faster on a long plan but visibly worse
      # (eltanin docs/planner-design.md 13.16).
      heuristic_weight: 0.8
      steering_penalty: 0.05
      # Has almost no effect at the default motion_step (eltanin docs/planner-design.md 13.7).
      steering_change_penalty: 0.10
      # 0 would allow the complete discretized state space to be expanded, so an unreachable goal
      # costs the whole reachable half; this is eltanin's own bound on that.
      max_expansions: 4000000
      # Hybrid A* searches a corridor around a raw A* guide, not the whole map. This is the
      # half width of that corridor in cells; 30 is 1.5 m at 0.05 m.
      corridor_margin_cells: 30
      # Ceiling on corridor cells * heading_bins. Above this the plan is refused in one line
      # rather than the search allocating tens of GB.
      max_states: 20000000
