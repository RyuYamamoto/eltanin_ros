set noparent
linelength=100
# The six filters below match what ament_cpplint passes unconditionally.
filter=-build/c++11,-runtime/references,-whitespace/braces,-whitespace/indent,-whitespace/parens,-whitespace/semicolon
# eltanin_ros specific: upstream cpplint cannot reproduce the ROS 2 double-underscore header guard
# (that is an ament_cpplint extension), and its include order is the opposite of the
# IncludeCategories in .clang-format. clang-format enforces the include order instead.
filter=-build/header_guard,-build/include_order
