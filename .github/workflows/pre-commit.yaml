name: pre-commit

on:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the local environment (ROS 2 Jazzy ships Python 3.12).
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
