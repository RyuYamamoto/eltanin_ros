site_name: eltanin_ros
site_description: ROS 2 packages that connect the eltanin navigation library to ROS 2
site_url: https://ryuyamamoto.github.io/eltanin_ros/
repo_url: https://github.com/RyuYamamoto/eltanin_ros
repo_name: RyuYamamoto/eltanin_ros
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide:
      - Build pitfalls: build.md
      - eltanin_ros_common: ros-common.md
      - eltanin_costmap: costmap.md
      - eltanin_planner: planner.md
      - eltanin_controller: controller.md
      - eltanin_bringup: bringup.md
      - Development: development.md

# Under `mkdocs build --strict` these warnings become errors, so a broken cross-link fails CI.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

# The published site is English only. docs/design/ holds the Japanese design document, so it stays
# out of the site and is read on GitHub instead; add it back to nav once it is translated.
exclude_docs: |
  requirements.txt
  design/*.md
