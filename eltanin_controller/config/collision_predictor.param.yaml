# Every parameter collision_predictor declares, written out. The machine values (robot.* and
# frames.*) are not here: they come from eltanin_ros_common/config/robot/<profile>.yaml through the
# /** wildcard, so no key appears in both files. robot.max_decel is the deceleration the braking
# law uses and robot.footprint the shape it checks; neither is redeclared here.
#
# Unlike path_follower this node declares every key with a default, so it starts with no
# configuration at all. That is safe because the default of output_enabled_on_startup is false.
collision_predictor:
  ros__parameters:
    # 20 Hz. The kachaka bridge watchdog is 0.3 s, so anything below 4 Hz can let it fire between
    # two cycles; the node warns rather than refusing, but do not go there.
    update_frequency: 20.0

    # Deadlines on the two inputs. A stamp in the future is stale too. Both are checked before the
    # transform, and any of them elapsing publishes a zero command rather than nothing.
    cmd_timeout: 0.3
    map_timeout: 0.5

    # false on the robot. Turning the output on while it is docked makes it drive off, so the
    # simulation configuration is the only one that should set this to true.
    output_enabled_on_startup: false

    # The prediction. The horizon is derived, not configured: it is
    # reaction_time + |v| / robot.max_decel, so prediction_steps is the only resolution knob.
    prediction_steps: 10
    # Latency budget [s]: sensor age, this cycle, cmd_timeout and the driver watchdog. It sets the
    # horizon at rest and caps the speed at which the remaining gap may be closed.
    reaction_time: 0.3
    # Distance kept in front of the predicted collision [m]. Below it the command is exactly zero,
    # so this is the line the body stops at, not a value it eases through.
    #
    # TUNED for kachaka: eltanin ships 0.2, inherited from navyu's safety limiter. That is a fixed
    # buffer on top of two laws that already account for stopping - at 0.3 m/s the braking term is
    # 0.09 m and the reaction term another 0.09 m - and in a 0.5 m corridor it is what stops the
    # body reaching a cusp. Measured on the robot: at a dead end the plan asked for a cusp 0.170 m
    # of travel from contact, 0.2 refused every one of 272 cycles and the follower never left its
    # first run. 0.10 lets the same approach run at 0.23 m/s and stops 0.10 m short of contact,
    # with the two laws adding 0.18 m on top of that.
    collision_margin: 0.10
    # false drops the centre-cell Free short-circuit check and is only ever useful for a
    # measurement; the node warns for the cycle it is off.
    exact_footprint_check: true

    # The proximity ramp, which slows the command down near an obstacle but never stops it.
    # Clearance is the room beside the body: the distance to the nearest obstacle less the
    # inscribed radius, which is 0.120 m on kachaka. In a corridor of width W driven down the
    # middle it reads W / 2 - 0.120, so 0.15 is full speed from 0.54 m of corridor upwards.
    #
    # TUNED for kachaka: eltanin ships 0.10 / 0.50 for its own 0.6 m square outline. Measured on
    # the robot in a 0.5 to 0.6 m corridor, 0.25 held the ramp near its floor for most of the
    # drive and the body ran at a quarter speed with 13 to 18 cm of clear floor on each side.
    stop_clearance: 0.0
    slow_down_clearance: 0.15
    # Strictly positive: a floor of 0 would make a 0.6 m corridor impassable. Stopping is the job
    # of the braking-distance and reaction-time laws alone.
    min_proximity_scale: 0.25
    # Time [s] the ramp takes to climb back to 1.0; dropping is always immediate.
    release_time: 0.5

    # Distances beyond this saturate [m]. It has to exceed the circumscribed radius of
    # robot.footprint, or the collision check can never report a free cell again.
    clearance_max_distance: 1.0
